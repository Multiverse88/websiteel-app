# Internal/admin infrastructure — deployed as a SEPARATE Dokploy
# application from docker-compose.dokploy.yml (which now only has the
# public `app` service). Split 2026-08-12: previously everything lived in
# one compose file, so pushing an unrelated change here (e.g. adding
# Adminer) triggered Dokploy to redeploy the public easylegal.biz.id site
# too. See notes/easylegal-checklist-2026-08-12.md.
#
# Setup on the VPS (one-time):
#   docker network create easylegal
# Both this file and docker-compose.dokploy.yml reference `easylegal` as
# an EXTERNAL network so containers in either stack can still reach each
# other by service name, even though they're now two separate
# `docker compose` projects. (The actual Postgres database lives in a
# separate Dokploy-managed resource, reached via `dokploy-network` — see
# the note below.)
#
# In Dokploy: create a second "Docker Compose" application pointing at
# this file (same repo/branch as the existing one, different compose
# file path).
services:
  # NOTE (2026-08-12): this compose does NOT run its own Postgres container.
  # The real database is a separately-managed Dokploy "Database" resource
  # (container name `easylegal-easylegal-qdpg8d-postgres-1`, on
  # `dokploy-network`) that already holds production data — 200 seeded
  # articles, contacts, etc. An earlier version of this file defined its own
  # `postgres:` service with a fresh empty volume, which would have been a
  # second, disconnected, empty database (Adminer would've shown nothing;
  # admin-api's DATABASE_URL never pointed at it anyway). Removed to avoid
  # that confusion — everything below talks to the existing Dokploy database
  # directly via DATABASE_URL / PGRST_DB_URI env vars.
  admin-api:                         # api.easylegal.my.id
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CRON_SECRET=${CRON_SECRET}
      - REVALIDATION_SECRET=${REVALIDATION_SECRET}
      - NEXT_PUBLIC_APP_URL=https://easylegal.biz.id
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - MINIO_ENDPOINT=cdn-storage
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=images
      - SENTRY_DSN=${SENTRY_DSN}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - AI_ROUTER_MODEL_REVIEW=${AI_ROUTER_MODEL_REVIEW}
      - AI_ROUTER_API_KEY=${AI_ROUTER_API_KEY}
      - AI_ROUTER_BASE_URL=${AI_ROUTER_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dokploy-network
      - easylegal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-api.rule=Host(`api.easylegal.my.id`)"
      - "traefik.http.routers.admin-api.entrypoints=websecure"
      - "traefik.http.routers.admin-api.tls.certResolver=letsencrypt"
      - "traefik.http.services.admin-api.loadbalancer.server.port=4000"

  admin-dashboard:                   # admin.easylegal.my.id/dashboard
    build:
      context: ./infra/admin-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - dokploy-network
      - easylegal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-dashboard.rule=Host(`admin.easylegal.my.id`) && PathPrefix(`/dashboard`)"
      - "traefik.http.routers.admin-dashboard.entrypoints=websecure"
      - "traefik.http.routers.admin-dashboard.tls.certResolver=letsencrypt"
      - "traefik.http.routers.admin-dashboard.middlewares=admin-dashboard-strip"
      - "traefik.http.middlewares.admin-dashboard-strip.stripprefix.prefixes=/dashboard"
      - "traefik.http.services.admin-dashboard.loadbalancer.server.port=80"

  postgrest:                         # admin.easylegal.my.id/db
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    environment:
      # Set PGRST_DB_URI in the Dokploy Environment tab to the full
      # connection string for the real Dokploy-managed database, e.g.
      # postgresql://postgres:<password>@easylegal-easylegal-qdpg8d-postgres-1:5432/easylegal
      PGRST_DB_URI: ${PGRST_DB_URI}
      PGRST_DB_SCHEMAS: easylegal,public
      PGRST_DB_ANON_ROLE: postgrest_anonymous
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_SERVER_PORT: "3001"
      PGRST_DB_USE_LEGACY_GUC: "false"
    networks:
      - dokploy-network
      - easylegal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.postgrest.rule=Host(`admin.easylegal.my.id`) && PathPrefix(`/db`)"
      - "traefik.http.routers.postgrest.entrypoints=websecure"
      - "traefik.http.routers.postgrest.tls.certResolver=letsencrypt"
      - "traefik.http.routers.postgrest.middlewares=postgrest-strip"
      - "traefik.http.middlewares.postgrest-strip.stripprefix.prefixes=/db"
      - "traefik.http.services.postgrest.loadbalancer.server.port=3001"

  adminer:                            # db.easylegal.my.id
    image: adminer:latest
    restart: unless-stopped
    # The official adminer image's default CMD binds to [::]:8080 (IPv6),
    # which crash-loops on Docker networks without IPv6 support ("Failed to
    # listen on [::]:8080 ... Name has no usable address"). Force IPv4.
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/var/www/html"]
    environment:
      # Points at the real Dokploy-managed Postgres container name directly
      # (see note at the top of this file) — not a `postgres` service
      # defined in this compose file, there isn't one.
      ADMINER_DEFAULT_SERVER: easylegal-easylegal-qdpg8d-postgres-1
    networks:
      - dokploy-network
      - easylegal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`db.easylegal.my.id`)"
      - "traefik.http.routers.adminer.entrypoints=websecure"
      - "traefik.http.routers.adminer.tls.certResolver=letsencrypt"
      # Basic auth on top of app-level login — this gives full read/write DB
      # access, don't leave it open to just Adminer's own login screen.
      # Credentials generated 2026-08-12; rotate by re-running:
      #   openssl passwd -apr1 '<new password>'
      # and swapping the hash below (escape every $ as $$ for docker-compose).
      - "traefik.http.routers.adminer.middlewares=adminer-auth"
      - "traefik.http.middlewares.adminer-auth.basicauth.users=admin:$$apr1$$3rrEIQ7G$$lXy4HNHQlmTeccyUoFrYA0"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"

  # ============================================
  # MinIO CDN Storage
  # ============================================
  cdn-storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    networks:
      - dokploy-network
      - easylegal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio-api.rule=Host(`cdn.easylegal.my.id`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls.certResolver=letsencrypt"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio-console.rule=Host(`cdn-console.easylegal.my.id`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certResolver=letsencrypt"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"

  cdn-init:
    image: minio/mc
    depends_on:
      - cdn-storage
    networks:
      - easylegal
    volumes:
      - ./public/images:/public-images
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://cdn-storage:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin};
      mc mb myminio/images || true;
      mc anonymous set public myminio/images;
      mc cp -r /public-images/ myminio/images/ || true;
      exit 0;
      "

  # ============================================
  # Instatic CMS (Landing Page Designer)
  # instatic.easylegal.my.id
  # ============================================
  # Visual editor untuk membuat landing pages.
  # SQLite default, bisa upgrade ke Postgres kalau perlu multi-user.
  # Plugin easylegal-integration akan connect ke admin-api untuk
  # import/export sections dan lead capture.
  #
  # First-time setup:
  #   1. Akses https://instatic.easylegal.my.id
  #   2. Buat owner account
  #   3. Install easylegal plugin (opsional, untuk Phase 2)
  #
  # Backup: cukup backup volume instatic-data (SQLite file + uploads)
  instatic:
    image: ghcr.io/corebunch/instatic:latest
    container_name: easylegal-instatic
    restart: unless-stopped
    environment:
      # SQLite — simple, no extra DB container needed
      # Data stored in /app/data/instatic.db
      - DATABASE_URL=file:/app/data/instatic.db
      # Secret key untuk session encryption — generate baru untuk production:
      #   openssl rand -hex 32
      - SECRET_KEY=${INSTATIC_SECRET_KEY:-change-me-in-production}
      # Public URL untuk akses admin
      - PUBLIC_URL=https://instatic.easylegal.my.id
      # Port internal (Traefik proxy ke port ini)
      - PORT=3001
      # AI Agent (opsional — isi API key untuk fitur AI)
      # - AI_PROVIDER=openai
      # - AI_API_KEY=${OPENAI_API_KEY}
      # - AI_MODEL=gpt-4
    volumes:
      # Persist SQLite database + uploaded media
      - instatic-data:/app/data
      - instatic-uploads:/app/uploads
    networks:
      - dokploy-network
      - easylegal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.instatic.rule=Host(`instatic.easylegal.my.id`)"
      - "traefik.http.routers.instatic.entrypoints=websecure"
      - "traefik.http.routers.instatic.tls.certResolver=letsencrypt"
      - "traefik.http.services.instatic.loadbalancer.server.port=3001"

volumes:
  instatic-data:
  instatic-uploads:
  minio-data:

networks:
  dokploy-network:
    external: true
  easylegal:
    external: true
