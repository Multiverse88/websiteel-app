name: Deploy to Dokku
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: dokku/github-action@v1
        with:
          ssh_private_key: ${{ secrets.DOKKU_SSH_KEY }}
          ssh_host: ${{ secrets.DOKKU_HOST }}
          git_remote_url: ssh://dokku@${{ secrets.DOKKU_HOST }}/easylegal
          command: deploy
          trace: "true"
