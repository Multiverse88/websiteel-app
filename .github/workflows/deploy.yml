name: Deploy to Dokku
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH test
        uses: appleboy/ssh-action@v1.7.0
        with:
          host: ${{ secrets.DOKKU_HOST }}
          username: dokku
          key: ${{ secrets.DOKKU_SSH_KEY }}
          envs: TEST
          script: |
            echo "SSH connected OK"
            echo "Running: git-receive-pack"
