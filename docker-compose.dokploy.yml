# Public site only — split 2026-08-12 from a single monolithic compose
# file that also had postgres/postgrest/admin-api/admin-dashboard/adminer.
# Reason: Dokploy treats one compose file as one deploy unit, so pushing an
# unrelated change (e.g. adding Adminer) was redeploying easylegal.biz.id
# too. See docker-compose.infra.dokploy.yml for everything else, and
# notes/easylegal-checklist-2026-08-12.md for the VPS-side setup this
# split requires (shared external `easylegal` network, second Dokploy app).
services:
  app:                               # easylegal.biz.id
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_TYPEBOT_BOT_ID=easylegal-assistant
        - NEXT_PUBLIC_API_URL=https://api.easylegal.my.id
    restart: unless-stopped
    environment:
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CRON_SECRET=${CRON_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - NEXT_PUBLIC_APP_URL=https://easylegal.biz.id
      - MINIO_ENDPOINT=http://host.docker.internal:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=images
      - MINIO_PUBLIC_URL=https://easylegal.biz.id/images
      - NEXT_PUBLIC_API_URL=https://api.easylegal.my.id
      - REVALIDATION_SECRET=${REVALIDATION_SECRET}
      - SENTRY_DSN=${SENTRY_DSN}
      - NEXT_PUBLIC_TYPEBOT_BOT_ID=easylegal-assistant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/public/uploads
    networks:
      - dokploy-network
      - easylegal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      # Multi-tenant: this app also serves easylegal.my.id (apex, added
      # 2026-08-11 for domain-locked landing pages — Domain model /
      # LandingPage.domainId) and easylegal.co.id (added 2026-08-12, see
      # src/lib/domains.ts for its per-domain SEO/WhatsApp config).
      # NOTE: easylegal.my.id currently has a Cloudflare-level redirect to
      # easylegal.biz.id — that redirect must be removed at Cloudflare or
      # requests never reach Traefik/this container at all. Also make sure
      # DNS for easylegal.co.id actually points at this VPS.
      - "traefik.http.routers.app.rule=Host(`easylegal.biz.id`) || Host(`www.easylegal.biz.id`) || Host(`easylegal.my.id`) || Host(`www.easylegal.my.id`) || Host(`easylegal.co.id`) || Host(`www.easylegal.co.id`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certResolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=3000"

volumes:
  uploads:

networks:
  dokploy-network:
    external: true
  # Shared with docker-compose.infra.dokploy.yml so `app` can still reach
  # `postgres` by hostname even though they're now separate Compose
  # projects. Create once on the VPS: `docker network create easylegal`
  easylegal:
    external: true
