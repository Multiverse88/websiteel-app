services:
  admin-api:
    build:
      context: /home/it_easylegal26/easylegal-admin-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - NEXT_PUBLIC_APP_URL=https://easylegal.biz.id
      - MINIO_ENDPOINT=cdn-storage
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=images
      - SENTRY_DSN=${SENTRY_DSN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dokploy-network
      - easylegal
    labels:                          # api.easylegal.my.id
      - "traefik.enable=true"
      - "traefik.http.routers.admin-api.rule=Host(`api.easylegal.my.id`)"
      - "traefik.http.routers.admin-api.entrypoints=websecure"
      - "traefik.http.routers.admin-api.tls.certResolver=letsencrypt"
      - "traefik.http.services.admin-api.loadbalancer.server.port=4000"

  admin-dashboard:                   # admin.easylegal.my.id
    build:
      context: /home/it_easylegal26/easylegal-admin-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - dokploy-network
      - easylegal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-dashboard.rule=Host(`admin.easylegal.my.id`)"
      - "traefik.http.routers.admin-dashboard.entrypoints=websecure"
      - "traefik.http.routers.admin-dashboard.tls.certResolver=letsencrypt"
      - "traefik.http.services.admin-dashboard.loadbalancer.server.port=80"

  app:                               # easylegal.biz.id
    build:
      context: /home/it_easylegal26/easylegal
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_TYPEBOT_BOT_ID=easylegal-assistant
        - NEXT_PUBLIC_API_URL=https://api.easylegal.my.id
    restart: unless-stopped
    environment:
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - NEXT_PUBLIC_APP_URL=https://easylegal.biz.id
      - MINIO_ENDPOINT=http://host.docker.internal:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=images
      - MINIO_PUBLIC_URL=https://easylegal.biz.id/images
      - NEXT_PUBLIC_API_URL=https://api.easylegal.my.id
      - REVALIDATION_SECRET=${REVALIDATION_SECRET}
      - SENTRY_DSN=${SENTRY_DSN}
      - NEXT_PUBLIC_TYPEBOT_BOT_ID=easylegal-assistant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/public/uploads
    networks:
      - dokploy-network
      - easylegal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`easylegal.biz.id`) || Host(`www.easylegal.biz.id`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certResolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=3000"

  # NOTE (2026-08-11): not exposed to Traefik (no labels, no host ports) and
  # not on dokploy-network — nothing outside this compose project's internal
  # network can reach it. Traefik handles all public routing now. Looks like
  # dead weight left over from the pre-Dokploy nginx-based setup; confirm
  # nothing internal depends on it before removing.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - /home/it_easylegal26/easylegal/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - uploads:/app/public/uploads:ro
    depends_on:
      - app
    networks:
      - easylegal

volumes:
  uploads:

networks:
  dokploy-network:
    external: true
  easylegal:
    driver: bridge
